<app-navbar></app-navbar>

<div class="container">
  <h2>Dashboard - Relatório de Agendamentos</h2>

  <div class="resumo">
    <div class="card-resumo">
      <h3>Total de Ganhos</h3>
      <p>R$ {{ totalGanhos }},00</p>
    </div>
    <div class="card-resumo">
      <h3>Total de Agendamentos</h3>
      <p>{{ totalAgendamentos }}</p>
    </div>
    <div class="card-resumo">
      <h3>Serviços Realizados</h3>
      <ul>
        <li *ngFor="let servico of (servicosContagem | keyvalue)">
          {{ servico.key }}: {{ servico.value }}
        </li>
      </ul>
    </div>
  </div>

  <div class="graficos">
    <div class="card-grafico">
      <h3>Clientes que mais cortaram (mês atual)</h3>
      <canvas baseChart
        [data]="pieChartData"
        [type]="pieChartType"
        [options]="chartOptions">
      </canvas>
    </div>

    <div class="card-grafico">
      <h3>Cortes por mês ({{ currentYear() }})</h3>
      <canvas baseChart
        [data]="barChartData"
        [type]="barChartType"
        [options]="chartOptions">
      </canvas>
    </div>
  </div>
</div>

<app-footer></app-footer>
